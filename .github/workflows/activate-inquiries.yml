name: Verify Perfect Dream Modular quote form setup
on:
  push:
    paths:
      - '.github/workflows/activate-inquiries.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger first-use form activation email
        run: |
          curl --silent --show-error --location --fail-with-body --max-time 45             -H 'Referer: https://perfectdreammodular.com/contact.html'             --data-urlencode 'name=Perfect Dream Modular - LAUNCH CHECK'             --data-urlencode 'email=unitedpaintersww@gmail.com'             --data-urlencode 'message=One-time test of contact form setup. Not a customer lead.'             --data-urlencode '_url=https://perfectdreammodular.com/contact.html'             --data-urlencode '_subject=PDM contact form activation test'             --data-urlencode '_captcha=false'             'https://formsubmit.co/unitedpaintersww@gmail.com' > /tmp/pdm-activation.html
          echo 'Provider response received; verification email may be required.'
