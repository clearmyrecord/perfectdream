name: Verify live modular inquiry delivery
on:
  push:
    paths:
      - '.github/workflows/activate-inquiries.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send controlled form submission
        run: |
          curl --silent --show-error --fail-with-body --max-time 45             -H 'Referer: https://perfectdreammodular.com/contact.html'             --data-urlencode 'name=Perfect Dream Modular launch test'             --data-urlencode 'email=unitedpaintersww@gmail.com'             --data-urlencode 'message=ONE-TIME FORM DELIVERY CHECK - NOT A CUSTOMER LEAD'             --data-urlencode '_email=unitedpaintersww@gmail.com'             --data-urlencode '_subject=Perfect Dream Modular test submission'             'https://formsend.co/functions/handleSubmission'
