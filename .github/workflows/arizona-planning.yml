name: Arizona planning regression tests
on:
  push:
    paths:
      - 'arizona-gis.js'
      - 'arizona-forms.html'
      - 'planning.html'
      - 'permit-screen*'
      - 'permit-package*'
      - 'permit-submission.html'
      - 'tests/arizona-planning.cjs'
      - '.github/workflows/arizona-planning.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/arizona-planning.cjs
