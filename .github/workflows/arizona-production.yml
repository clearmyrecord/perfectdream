name: Arizona live integration verification
on:
  push:
    paths:
      - '.github/workflows/arizona-production.yml'
      - 'tests/arizona-production.cjs'
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: node tests/arizona-production.cjs
