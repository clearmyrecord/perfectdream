name: Publish manufacturer photos to local website
on:
  push:
    paths:
      - 'scripts/localize_supplier_images.py'
      - '.github/workflows/pdm-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download and optimize official supplier product imagery
        run: python scripts/localize_supplier_images.py
      - name: Publish locally hosted images
        run: |
          git config user.name 'pdm-photo-publisher'
          git config user.email 'pdm-photo-publisher@users.noreply.github.com'
          git add assets/photos
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified manufacturer photo library'
            git push
          fi
